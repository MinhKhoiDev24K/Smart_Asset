name: Build and Push (SmartAsset)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  # ===========================
  # FRONTEND BUILD & PUSH
  # ===========================
  build-and-push-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers (Frontend)
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache-frontend
          key: ${{ runner.os }}-frontend-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartasset-frontend:latest
          cache-from: type=local,src=/tmp/.buildx-cache-frontend
          cache-to: type=local,dest=/tmp/.buildx-cache-frontend

  # ===========================
  # BACKEND BUILD & PUSH
  # ===========================
  build-and-push-backend:
    runs-on: ubuntu-latest
    needs: build-and-push-frontend   # nếu muốn chạy tuần tự

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers (Backend)
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache-backend
          key: ${{ runner.os }}-backend-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai_module
          file: ./ai_module/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartasset-backend:latest
          cache-from: type=local,src=/tmp/.buildx-cache-backend
          cache-to: type=local,dest=/tmp/.buildx-cache-backend
