name: Build and Push Frontend (SmartAsset)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-push-frontend:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code từ repo
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2️⃣ Login Docker Hub bằng secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      # 3️⃣ Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4️⃣ Cache Docker layers để build nhanh hơn
      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-frontend-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      # 5️⃣ Build và Push image frontend
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartasset-frontend:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
