apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartasset-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/MinhKhoiDev24K/Smart_Asset.git
    targetRevision: master
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
